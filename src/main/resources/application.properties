spring.application.name=budget-api

# Configuração do H2 Database
spring.datasource.url=jdbc:h2:mem:budgetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Configuração Spring AI (A chave será injetada via variável de ambiente)
spring.ai.openai.api-key=${OPENAI_API_KEY:sua-chave-aqui}